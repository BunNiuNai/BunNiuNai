<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <rect width="420" height="120" rx="8" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="210" y="28" fill="#667eea" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🔥 GitHub 连续提交</text>

  <!-- 当前连续 -->
  <text x="70" y="68" fill="#1f2937" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="middle">0</text>
  <text x="70" y="88" fill="#6b7280" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">当前连续（天）</text>

  <!-- 最长连续 -->
  <text x="210" y="68" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="middle">0</text>
  <text x="210" y="88" fill="#6b7280" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">最长连续（天）</text>

  <!-- 总贡献 -->
  <text x="350" y="68" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" text-anchor="middle">0</text>
  <text x="350" y="88" fill="#6b7280" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">总贡献数</text>

  <!-- 分割线 -->
  <line x1="140" y1="50" x2="140" y2="100" stroke="#e5e7eb" stroke-width="0.5" opacity="0.2"/>
  <line x1="280" y1="50" x2="280" y2="100" stroke="#e5e7eb" stroke-width="0.5" opacity="0.2"/>
</svg>